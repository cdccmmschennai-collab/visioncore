services:
  db:
    image: postgres:16-alpine
    container_name: visioncore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visioncore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visioncore}
      POSTGRES_DB: ${POSTGRES_DB:-visioncore}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # -q keeps the readiness probe out of the container logs
      test: ["CMD-SHELL", "pg_isready -q -U ${POSTGRES_USER:-visioncore} -d ${POSTGRES_DB:-visioncore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: visioncore-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: visioncore-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_DIR: /data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/data/storage
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    container_name: visioncore-worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_DIR: /data/storage
    command: ["celery", "-A", "worker.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/data/storage

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: visioncore-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  pgdata:
  storage:
  redisdata:
