server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A Batch Process run can carry up to 100 tags x 3 images x 15MB each
    # (~4.5GB, with headroom); the default 1m limit would reject that long
    # before it reaches the backend.
    client_max_body_size 5G;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html must never be cached or users
    # keep loading the previous build after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A multi-GB Batch Process upload can take a long time to transfer
        # on anything but a fast connection, on top of vision extraction
        # itself already being slow.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — client-side routes must not 404 on refresh.
    # no-store here too: try_files serving index.html for a directory
    # request (e.g. "/") never re-enters location matching, so the
    # "location = /index.html" rule above doesn't cover the bare URL,
    # letting browsers cache/keep a stale build there.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
